# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs

# Each component describes its own dependencies in a devenv.nix next to its code, and
# those are merged into the **default** shell: the toolchain, the native libraries and the
# client-side configuration needed to build and unit-test the workspace.
#
# Nothing here starts a service. The services each component talks to are declared in a
# devenv-stack.nix beside the same code and collected by the `stack` profile
# (`devenv --profile stack up`); see devenv.nix.
imports:
  - ./crates/vs-infra
  - ./crates/vs-vault
  - ./crates/vs-ingest
  - ./crates/vs-vectors
  - ./crates/vs-worker
