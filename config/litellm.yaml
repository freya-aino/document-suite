# LiteLLM proxy for local development. Start with `vs-litellm-up` (devenv).
#
# The suite talks plain OpenAI to :4000 and never knows what is behind it, so this file is
# the only thing you edit when you swap which model is serving. The aliases in
# `model_name` are what `config/models.litellm.toml` asks for — keep the two in step.
#
# `hosted_vllm/` is LiteLLM's routing prefix for an OpenAI-compatible server. It belongs
# here, in `litellm_params.model`, and *not* in the suite's registry: the suite asks the
# proxy for the alias.

model_list:
  # Document-parsing VLM. Serve the weights with, for example:
  #   vllm serve PaddlePaddle/PaddleOCR-VL --port 8000 --served-model-name PaddleOCR-VL
  # vLLM also ships dedicated architectures for GLM-OCR, HunyuanOCR and LightOnOCR-1B,
  # so any of those can take this slot without touching the suite.
  - model_name: doc-parse
    litellm_params:
      model: hosted_vllm/PaddleOCR-VL
      api_base: http://127.0.0.1:8000/v1
      api_key: none
    model_info:
      supports_vision: true

  # General VLM: figure descriptions, chart-to-table, page classification.
  #   vllm serve Qwen/Qwen3-VL-2B-Instruct --port 8001 --served-model-name Qwen3-VL-2B
  - model_name: vlm-general
    litellm_params:
      model: hosted_vllm/Qwen3-VL-2B
      api_base: http://127.0.0.1:8001/v1
      api_key: none
    model_info:
      supports_vision: true

  # Text LLM for Stage 2 extraction, verification and the entity judge.
  - model_name: extract-llm
    litellm_params:
      model: hosted_vllm/Qwen3-8B
      api_base: http://127.0.0.1:8002/v1
      api_key: none

  # Embeddings. The dimension here must match `dimensions` in models.litellm.toml, and it
  # fixes the size of the Qdrant collections the first time a doc worker starts.
  - model_name: embed-text
    litellm_params:
      model: hosted_vllm/Qwen3-Embedding-0.6B
      api_base: http://127.0.0.1:8003/v1
      api_key: none

litellm_settings:
  # Pass structured-output requests through untouched: the suite relies on vLLM's guided
  # decoding, and a proxy-side rewrite would silently change what the model is asked for.
  drop_params: false
  # Local models are slow; the suite has its own per-model timeout from the registry.
  request_timeout: 600

general_settings:
  # No master key: this is a loopback development proxy. Do not expose it.
  completion_model: doc-parse
