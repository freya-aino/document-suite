# vs-worker / vs-api configuration. Secrets come from the environment (VS__SECTION__KEY)
# or MMDS, never from this file.

[bus]
nats_url = "nats://nats.internal:4222"

[blob]
bucket = "visual-suite"
endpoint = "https://s3.internal"
region = "eu-west-1"

[postgres]
url = "postgres://vs_app@pgbouncer.internal:6432/visual_suite"   # password: VS__POSTGRES__PASSWORD
max_connections = 4

[helix]
url = "http://helix.internal:6969"

[models]
registry = "/etc/vs/models.toml"

[worker]
max_in_flight = 32
interactive_share = 0.3
render_dpi = 200
max_failed_page_fraction = 0.05
# Ingest: originals are spooled here and rendered by child processes.
# scratch_dir = "/scratch"          # default: system temp dir
# render_processes = 2              # default: available CPUs
page_render_timeout_s = 60
# render_mem_limit_mb = 1536

[api]
max_upload_bytes = 2147483648      # 2 GiB; multipart uploads above this get 413
interactive_max_pending = 1000     # 429 for interactive requests above this lane backlog
# scratch_dir = "/scratch"         # upload spool while hashing; default: system temp dir

[classify]
born_digital_min_chars = 50
born_digital_min_coverage = 0.8
trust_ocr_layer = false
skip_vision_for_text_only_digital = true

[stage2]
# `page` and `doc` roles. Model names are ids from [models].registry.
extraction_model = "extract-llm"
verify_model = "extract-llm"
embedding_model = "embed-text"
classifier_model = "page-classifier"   # omit for rules-only page classification
# judge_model = "extract-llm"          # LLM judge for ambiguous corpus-resolution candidates
window_chars = 12000
type_match_threshold = 0.85
link_threshold = 0.92
judge_band = [0.80, 0.92]
embed_batch_size = 0                   # 0 = the model's registry batch_size
dag_list_refresh_s = 60                # how long a worker trusts its cached active DAG list

[telemetry]
otlp_endpoint = "http://otel-collector.internal:4317"
json_logs = true
