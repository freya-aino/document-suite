# Local development config: points at the devenv services
# (`devenv --profile stack up`). Secrets (DS__POSTGRES__PASSWORD, AWS_*) come from the
# devenv environment. Every key and its default: deploy/README.md § Configuration.

[blob]
bucket = "document-suite"
endpoint = "http://127.0.0.1:3900"
region = "garage"

[postgres]
url = "postgres://ds_app@127.0.0.1:5432/document_suite"   # password: DS__POSTGRES__PASSWORD
max_connections = 4

[qdrant]
url = "http://127.0.0.1:6334"
collection_prefix = "ds_dev"

[models]
registry = "config/models.example.toml"

[worker]
max_in_flight = 32
interactive_share = 0.3
render_dpi = 200
max_failed_page_fraction = 0.05
max_documents = 4                  # documents processed at once in this process
page_attempts = 3                  # per-page retries on a transient failure (1 = none)
# Ingest: originals are spooled here and rendered by child processes.
# scratch_dir = "/scratch"          # default: system temp dir
# render_processes = 2              # default: available CPUs
page_render_timeout_s = 60
# render_mem_limit_mb = 1536
# Recovery is on locally too, and fast, because a crash during development is how you find
# out whether it works.
lease_ttl_s = 60
resume_interval_s = 30

[api]
max_upload_bytes = 2147483648      # 2 GiB; multipart uploads above this get 413
interactive_max_pending = 1000     # 429 for interactive requests above this many in flight
# scratch_dir = "/scratch"         # upload spool while hashing; default: system temp dir
# Local development reads what it uploads from a second token more often than it tests
# isolation, so this is `organization` here and `private` in the example: a document
# uploaded by `ds-token` is readable by `ds-token other-person` without sharing it first.
# Set it to `private` to exercise the scoping the API ships with.
default_visibility = "organization"
# Off locally: a tight loop of curl against one organization is a development habit, not
# abuse, and a 429 in the middle of it wastes an afternoon.
tenant_rate_per_s = 0

[auth]
# ds-api refuses to start without this. `devenv --profile stack up` starts a Keycloak
# here and imports the realm these values describe (deploy/keycloak/README.md);
# `ds-token` fetches a token from it.
issuer = "http://127.0.0.1:8081/realms/koki"
audience = ["ds-api"]
client_id = "ds-api"
org_claim = "organization"
admin_role = "ds-admin"

[classify]
born_digital_min_chars = 50
born_digital_min_coverage = 0.8
trust_ocr_layer = false
skip_vision_for_text_only_digital = true

[stage2]
# `page` and `doc` roles. Model names are ids from [models].registry.
extraction_model = "extract-llm"
verify_model = "extract-llm"
embedding_model = "embed-text"
classifier_model = "page-classifier"   # omit for rules-only page classification
# judge_model = "extract-llm"          # LLM judge for ambiguous corpus-resolution candidates
window_chars = 12000
type_match_threshold = 0.85
link_threshold = 0.92
judge_band = [0.80, 0.92]
embed_batch_size = 0                   # 0 = the model's registry batch_size
dag_list_refresh_s = 60                # how long a worker trusts its cached active DAG list

[telemetry]
# otlp_endpoint: none locally
# metrics_addr: unset, so nothing binds a port. The recorder is still installed, so
# `ds-api` serves the same series on its own /metrics.
json_logs = false
