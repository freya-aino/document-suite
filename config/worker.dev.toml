# Local development config: points at the devenv services (`devenv up`).
# Secrets (VS__POSTGRES__PASSWORD, AWS_*) come from the devenv environment.

[bus]
nats_url = "nats://127.0.0.1:4222"

[blob]
bucket = "visual-suite"
endpoint = "http://127.0.0.1:3900"
region = "garage"

[postgres]
url = "postgres://vs@127.0.0.1:5432/visual_suite"   # password: VS__POSTGRES__PASSWORD
max_connections = 4

[helix]
url = "http://127.0.0.1:6969"

[models]
registry = "config/models.example.toml"

[worker]
max_in_flight = 32
interactive_share = 0.3
render_dpi = 200
max_failed_page_fraction = 0.05
# Ingest: originals are spooled here and rendered by child processes.
# scratch_dir = "/scratch"          # default: system temp dir
# render_processes = 2              # default: available CPUs
page_render_timeout_s = 60
# render_mem_limit_mb = 1536

[classify]
born_digital_min_chars = 50
born_digital_min_coverage = 0.8
trust_ocr_layer = false
skip_vision_for_text_only_digital = true

[telemetry]
# otlp_endpoint: none locally
json_logs = false
