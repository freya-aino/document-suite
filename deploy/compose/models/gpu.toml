# Model registry for the `gpu` tier of the integration stack: the pools of
# deploy/gpu/docker-compose.yml reached **from inside the compose network**, by service
# name on port 8000.
#
# deploy/gpu/models.compose.toml is the same pools reached from the *host*, on the
# published 800x ports. Both exist because they answer different questions: that file is
# for a developer with curl, this one is what the service mounts. Same ids as
# config/models.example.toml, as every tier's registry has — that is what lets one search
# space and one DAG list run on all of them.

[[model]]
id = "paddleocr-vl-1.5"
revision = "2026-01"
family = "paddleocr_vl"
task = ["page_parse", "region_ocr", "table", "formula"]
endpoints = ["http://doc-parse:8000/v1"]      # service doc-parse
# Only interactive uploads are sent here (service doc-parse-interactive, the
# `interactive` compose profile). Comment it out and interactive pages queue behind the
# batch in the shared pool, which is what happens without a reserved lane.
interactive_endpoints = ["http://doc-parse-interactive:8000/v1"]
max_concurrency = 256
timeout_ms = 60000
languages = ["*"]

[[model]]
id = "mineru-2.5"
revision = "2025-09"
family = "mineru"
task = ["page_parse", "layout", "table", "formula"]
endpoints = ["http://layout:8000/v1"]      # service layout
max_concurrency = 256

[[model]]
id = "qwen3-vl"
revision = "pin-me"
family = "generic_json"
task = ["figure_describe", "chart_to_table", "judge"]
endpoints = ["http://vlm-general:8000/v1"]      # service vlm-general
max_concurrency = 128
timeout_ms = 90000

[[model]]
id = "page-classifier"
revision = "pin-me"
family = "generic_json"
task = ["page_classify"]
endpoints = ["http://classifier:8000/v1"]      # service classifier
max_concurrency = 512
timeout_ms = 10000

[[model]]
id = "extract-llm"
revision = "pin-me"
family = "generic_json"
task = ["extract", "verify", "type_normalise", "entity_judge"]
endpoints = ["http://llm-extract:8000/v1"]      # service llm-extract
max_concurrency = 128
timeout_ms = 120000

[[model]]
id = "embed-text"
revision = "pin-me"
family = "embedding"
task = ["embed"]
endpoints = ["http://embed:8000/v1"]      # service embed
max_concurrency = 64
