# Pool "embed": vLLM serving Qwen/Qwen3-Embedding-0.6B as "embed-text" (registry id in config/models.toml).
# Workers reach it at http://embed.vs-gpu.svc:8000/v1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed
  namespace: vs-gpu
  labels: { app.kubernetes.io/name: vllm, vs.pool: embed }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # keep capacity while rolling
  selector:
    matchLabels: { app.kubernetes.io/name: vllm, vs.pool: embed }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vllm, vs.pool: embed }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 120   # drain in-flight requests
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - "Qwen/Qwen3-Embedding-0.6B"
            - "--served-model-name=embed-text"
            - "--revision=$(MODEL_REVISION)"
            - "--port=8000"
            - "--task=embed"
            - "--max-num-seqs=256"
            - "--gpu-memory-utilization=0.92"
            - "--max-model-len=8192"
          env:
            - name: MODEL_REVISION
              value: "main"                # pin: must match the registry's `revision`
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } }
            - name: HF_HOME
              value: /cache/huggingface
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 32Gi
          volumeMounts:
            - { name: hf-cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90           # weights download + graph compile
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: hf-cache
          persistentVolumeClaim: { claimName: hf-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
---
apiVersion: v1
kind: Service
metadata:
  name: embed
  namespace: vs-gpu
  labels: { app.kubernetes.io/name: vllm, vs.pool: embed }
spec:
  selector: { app.kubernetes.io/name: vllm, vs.pool: embed }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# Scales on vLLM's queue depth. The metric comes from the custom metrics API: the
# annotation below is read by kube-metrics-adapter (or adapt it to prometheus-adapter's
# rules / KEDA's prometheus scaler) and evaluates the PromQL per pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: embed
  namespace: vs-gpu
  annotations:
    metric-config.pods.vllm-num-requests-waiting.prometheus/query: |
      sum(vllm:num_requests_waiting{namespace="vs-gpu", pod="{{.Pod}}"})
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: embed }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Pods
      pods:
        metric: { name: vllm-num-requests-waiting }
        target: { type: AverageValue, averageValue: "8" }   # queued requests per replica
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]   # cold starts are slow
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Pods, value: 1, periodSeconds: 300 }]
