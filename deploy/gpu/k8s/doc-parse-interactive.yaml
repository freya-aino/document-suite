# Pool "doc-parse-interactive": the **reserved lane** for interactive uploads.
#
# The same weights and the same served name as `doc-parse`, on its own replicas. The
# registry's `interactive_endpoints` points at this service and nothing else does, so a
# page from an interactive upload never queues behind a batch.
#
# Why separate replicas rather than a larger shared pool: the suite reserves page slots
# for interactive documents on its own side, which stops a batch from filling a *copy of
# the service* — and does nothing about the batch's requests already sitting in a vLLM
# queue. A thousand batch pages and one interactive page queue together at the GPU, and
# the page waits behind them. Short of a scheduler inside vLLM, the only fix is replicas
# the batch cannot reach.
#
# Sized for latency rather than throughput: fewer concurrent sequences, a floor of one
# replica so the lane is never cold, and a queue-depth target a third of the shared
# pool's — a request waiting here is the one a person is watching.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-parse-interactive
  namespace: ds-gpu
  labels: { app.kubernetes.io/name: vllm, ds.pool: doc-parse-interactive }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # keep capacity while rolling
  selector:
    matchLabels: { app.kubernetes.io/name: vllm, ds.pool: doc-parse-interactive }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vllm, ds.pool: doc-parse-interactive }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 120   # drain in-flight requests
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - "PaddlePaddle/PaddleOCR-VL-1.5"
            - "--served-model-name=paddleocr-vl-1.5"
            - "--revision=$(MODEL_REVISION)"
            - "--port=8000"
            - "--max-num-seqs=32"
            - "--enable-prefix-caching"
            - "--limit-mm-per-prompt={"image":1}"
            - "--gpu-memory-utilization=0.92"
            - "--max-model-len=16384"
            - "--trust-remote-code"
          env:
            - name: MODEL_REVISION
              value: "main"                # pin: must match the registry's `revision`
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: HF_TOKEN } }
            - name: HF_HOME
              value: /cache/huggingface
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 32Gi
          volumeMounts:
            - { name: hf-cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90           # weights download + graph compile
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: hf-cache
          persistentVolumeClaim: { claimName: hf-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
---
apiVersion: v1
kind: Service
metadata:
  name: doc-parse-interactive
  namespace: ds-gpu
  labels: { app.kubernetes.io/name: vllm, ds.pool: doc-parse-interactive }
spec:
  selector: { app.kubernetes.io/name: vllm, ds.pool: doc-parse-interactive }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# Scales on vLLM's queue depth. The metric comes from the custom metrics API: the
# annotation below is read by kube-metrics-adapter (or adapt it to prometheus-adapter's
# rules / KEDA's prometheus scaler) and evaluates the PromQL per pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doc-parse-interactive
  namespace: ds-gpu
  annotations:
    metric-config.pods.vllm-num-requests-waiting.prometheus/query: |
      sum(vllm:num_requests_waiting{namespace="ds-gpu", pod="{{.Pod}}"})
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: doc-parse-interactive }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Pods
      pods:
        metric: { name: vllm-num-requests-waiting }
        target: { type: AverageValue, averageValue: "2" }   # a third of the shared pool's: someone is waiting
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]   # cold starts are slow
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Pods, value: 1, periodSeconds: 300 }]
