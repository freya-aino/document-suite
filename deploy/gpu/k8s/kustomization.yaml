apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ds-gpu
resources:
  - namespace.yaml
  - doc-parse.yaml
  # The reserved interactive lane. Drop this line for a deployment that only does batch
  # work: it costs a GPU, and without it interactive pages share the pool above.
  - doc-parse-interactive.yaml
  - layout.yaml
  - vlm-general.yaml
  - classifier.yaml
  - llm-extract.yaml
  - embed.yaml
