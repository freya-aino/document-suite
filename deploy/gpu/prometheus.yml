# Prometheus scrape config for the GPU tier (docker compose --profile monitoring).
# vLLM exposes /metrics on its API port; the autoscaler watches
# vllm:num_requests_waiting (queue depth) and vllm:e2e_request_latency_seconds per pool,
# both labelled by `pool` below. Add a DCGM exporter target for GPU utilisation.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["doc-parse:8000"]
        labels: { pool: doc-parse, served_model: paddleocr-vl-1.5 }
      - targets: ["layout:8000"]
        labels: { pool: layout, served_model: mineru-2.5 }
      - targets: ["vlm-general:8000"]
        labels: { pool: vlm-general, served_model: qwen3-vl }
      - targets: ["classifier:8000"]
        labels: { pool: classifier, served_model: page-classifier }
      - targets: ["llm-extract:8000"]
        labels: { pool: llm-extract, served_model: extract-llm }
      - targets: ["embed:8000"]
        labels: { pool: embed, served_model: embed-text }

  # Optional: NVIDIA DCGM exporter on the host (docker run nvcr.io/nvidia/k8s/dcgm-exporter).
  # - job_name: dcgm
  #   static_configs:
  #     - targets: ["host.docker.internal:9400"]

rule_files:
  - /etc/prometheus/rules/*.yml
