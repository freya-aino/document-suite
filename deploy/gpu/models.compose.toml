# Model registry for the docker-compose GPU tier (deploy/gpu/docker-compose.yml), reached
# from the host. Same ids as config/models.example.toml; only the endpoints differ
# (compose publishes each pool on its own host port). Point `[models] registry` at this
# file, or copy the endpoints into config/models.toml.

[[model]]
id = "paddleocr-vl-1.5"
revision = "2026-01"
family = "paddleocr_vl"
task = ["page_parse", "region_ocr", "table", "formula"]
endpoints = ["http://localhost:8001/v1"]      # service doc-parse
max_concurrency = 256
timeout_ms = 60000
languages = ["*"]

[[model]]
id = "mineru-2.5"
revision = "2025-09"
family = "mineru"
task = ["page_parse", "layout", "table", "formula"]
endpoints = ["http://localhost:8002/v1"]      # service layout
max_concurrency = 256

[[model]]
id = "qwen3-vl"
revision = "pin-me"
family = "generic_json"
task = ["figure_describe", "chart_to_table", "judge"]
endpoints = ["http://localhost:8003/v1"]      # service vlm-general
max_concurrency = 128
timeout_ms = 90000

[[model]]
id = "page-classifier"
revision = "pin-me"
family = "generic_json"
task = ["page_classify"]
endpoints = ["http://localhost:8004/v1"]      # service classifier
max_concurrency = 512
timeout_ms = 10000

[[model]]
id = "extract-llm"
revision = "pin-me"
family = "generic_json"
task = ["extract", "verify", "type_normalise", "entity_judge"]
endpoints = ["http://localhost:8005/v1"]      # service llm-extract
max_concurrency = 128
timeout_ms = 120000

[[model]]
id = "embed-text"
revision = "pin-me"
family = "embedding"
task = ["embed"]
endpoints = ["http://localhost:8006/v1"]      # service embed
max_concurrency = 64
