# The config file baked into the image, as the smallest one that is still valid.
#
# Two ways to replace it: mount your own over /etc/ds/worker.toml, or leave this and set
# the rest from the environment (`DS__SECTION__KEY`). Both work — an almost-empty file
# plus environment variables is a complete configuration. Every key, its default and the
# override rules: deploy/README.md § Configuration.
#
# [bus], [blob], [postgres] and [qdrant] are required and deliberately missing here: there
# is no sensible default for someone else's infrastructure, so the service stops at
# startup with `missing field <section>` until they are set. That is the intended
# behaviour — a container that came up pointing at nothing would be worse.

[models]
# Mount the model registry here. The `page` and `doc` roles refuse to start without it;
# `api` and `ingest` run without ever reading it.
registry = "/etc/ds/models.toml"

[telemetry]
# A container's stdout is collected by something, so structure it by default.
json_logs = true
