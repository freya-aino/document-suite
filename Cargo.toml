[workspace]
resolver = "2"
members = [
    "crates/ds-core",
    "crates/ds-infra",
    "crates/ds-api",
    "crates/ds-ingest",
    "crates/ds-classify",
    "crates/ds-dag",
    "crates/ds-router",
    "crates/ds-models",
    "crates/ds-steps",
    "crates/ds-stitch",
    "crates/ds-extract",
    "crates/ds-graph",
    "crates/ds-vault",
    "crates/ds-vectors",
    "crates/ds-worker",
    "crates/ds-suite",
    "crates/ds-adapt",
    "crates/ds-mcp",
    "crates/ds-testkit",
    "crates/ds-itest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Tracks the newest stable Rust, not a minimum anyone is asked to support: the policy is
# to build on the current toolchain and the current dependency versions. It is capped by
# what the dev shell provides (nixpkgs stable, 1.99.1 today) rather than by the newest
# release, because a value above that makes the project unbuildable in its own shell.
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal
ds-core = { path = "crates/ds-core" }
ds-testkit = { path = "crates/ds-testkit" }
ds-itest = { path = "crates/ds-itest" }
ds-adapt = { path = "crates/ds-adapt" }
ds-infra = { path = "crates/ds-infra" }
ds-ingest = { path = "crates/ds-ingest" }
ds-classify = { path = "crates/ds-classify" }
ds-dag = { path = "crates/ds-dag" }
ds-router = { path = "crates/ds-router" }
ds-models = { path = "crates/ds-models" }
ds-steps = { path = "crates/ds-steps" }
ds-stitch = { path = "crates/ds-stitch" }
ds-extract = { path = "crates/ds-extract" }
ds-graph = { path = "crates/ds-graph" }
ds-vault = { path = "crates/ds-vault" }
ds-vectors = { path = "crates/ds-vectors" }
ds-api = { path = "crates/ds-api" }
ds-worker = { path = "crates/ds-worker" }
ds-mcp = { path = "crates/ds-mcp" }

# external
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
metrics = "0.24"
opentelemetry = "0.33"
# OTLP over HTTP/protobuf rather than gRPC: reqwest is already here with rustls, tonic is
# not, and every collector accepts both. The *blocking* reqwest client, because the SDK's
# batch span processor owns a dedicated thread with no Tokio reactor on it — the async
# client panics there, on a background thread, losing every span while the process looks
# healthy (`tests/traces.rs` is what catches that).
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# `rust_crypto` rather than `aws_lc_rs`: verifying a token is the one place in the suite
# where a pure-Rust implementation is both available and free (goal G9), and with exactly
# one backend feature enabled the provider needs no installation at startup.
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "rust_crypto"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
# Pure-Rust image operations for the pre-processing steps (goal G9: no OpenCV bindings).
imageproc = { version = "0.27", default-features = false }
object_store = { version = "0.14", features = ["aws"] }
# `thread_safe` (was `sync` in 0.8): one process-wide binding shared across threads, with
# calls serialised.
#
# The ABI feature is pinned deliberately. 0.9's default is `pdfium_latest`, whose bindings
# are generated for pdfium 8125 and therefore resolve `FPDF_StructElement_GetRawType` at
# load time — a symbol neither pdfium 8066 we run exports (checked with `nm` against both
# nixpkgs' build and the prebuilt one the container uses; they export 28 other
# `FPDF_StructElement_*` functions and not that one). Binding then fails outright, so
# every page fails to render. `pdfium_7543` is the newest API surface the crate knows that
# our library actually has, and nothing here calls anything newer.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7543", "image_latest", "thread_safe"] }
qdrant-client = "1.20"
# 0.13 renamed the TLS features: `rustls` is now the aws-lc-rs provider plus
# `rustls-platform-verifier`, so certificates come from the system trust store instead of
# webpki's bundled roots. That suits the deployments here, which both ship a CA bundle
# (the image installs ca-certificates, the microVM rootfs bakes one in), and it is why
# they must.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono", "uuid", "json", "migrate"] }
thiserror = "2"
tiff = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
