[workspace]
resolver = "2"
members = [
    "crates/vs-core",
    "crates/vs-infra",
    "crates/vs-api",
    "crates/vs-ingest",
    "crates/vs-classify",
    "crates/vs-dag",
    "crates/vs-router",
    "crates/vs-models",
    "crates/vs-steps",
    "crates/vs-stitch",
    "crates/vs-extract",
    "crates/vs-graph",
    "crates/vs-vault",
    "crates/vs-vectors",
    "crates/vs-worker",
    "crates/vs-suite",
    "crates/vs-adapt",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal
vs-core = { path = "crates/vs-core" }
vs-infra = { path = "crates/vs-infra" }
vs-ingest = { path = "crates/vs-ingest" }
vs-classify = { path = "crates/vs-classify" }
vs-dag = { path = "crates/vs-dag" }
vs-router = { path = "crates/vs-router" }
vs-models = { path = "crates/vs-models" }
vs-steps = { path = "crates/vs-steps" }
vs-stitch = { path = "crates/vs-stitch" }
vs-extract = { path = "crates/vs-extract" }
vs-graph = { path = "crates/vs-graph" }
vs-vault = { path = "crates/vs-vault" }
vs-vectors = { path = "crates/vs-vectors" }
vs-api = { path = "crates/vs-api" }
vs-worker = { path = "crates/vs-worker" }

# external
anyhow = "1"
async-nats = "0.38"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
metrics = "0.24"
opentelemetry = "0.33"
# OTLP over HTTP/protobuf rather than gRPC: reqwest is already here with rustls, tonic is
# not, and every collector accepts both. The *blocking* reqwest client, because the SDK's
# batch span processor owns a dedicated thread with no Tokio reactor on it — the async
# client panics there, on a background thread, losing every span while the process looks
# healthy (`tests/traces.rs` is what catches that).
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
metrics-exporter-prometheus = { version = "0.17", default-features = false }
# Pinned to 9: 10 and later declare rust-version 1.88, above the MSRV this workspace
# declares and CI enforces. 9.3 is MSRV 1.73 and has the JWK API this needs.
jsonwebtoken = "9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
# Pure-Rust image operations for the pre-processing steps (goal G9: no OpenCV bindings).
imageproc = { version = "0.27", default-features = false }
object_store = { version = "0.11", features = ["aws"] }
# `sync`: one process-wide binding shared across threads (calls are serialised).
pdfium-render = { version = "0.8", features = ["sync"] }
qdrant-client = "1.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono", "uuid", "json", "migrate"] }
thiserror = "2"
tiff = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
