# The gate the checklists in SPEC.md and the READMEs assume exists.
#
# Six jobs, because they fail for six different reasons:
#
# - `check` is the fast one, and the one that earns its keep: clippy with `-D warnings`
#   over everything, then the tests that need no service.
# - `newest` updates the lockfile and runs both again. The policy is to track the newest
#   stable Rust and the newest dependency versions, so what needs checking is not an old
#   toolchain but what the new versions break — reported here before a routine
#   `cargo update` does it to someone locally. Informational: it does not gate a merge,
#   because what it catches is upstream's change and not this pull request's.
# - `integration` runs the tests marked `#[ignore]`. They are not optional extras: the
#   first time they were ever executed they found three real defects, two of them months
#   old. Nothing but this job makes them run.
# - `lint` checks the things that are not Rust and were therefore checked by nothing. An
#   audit found four defects in `deploy/`, three of which this job would have caught:
#   shellcheck reads a variable that is never assigned under `set -u`, `cargo machete`
#   finds a dependency nobody uses, and a migration whose bytes change breaks every
#   database that already ran it (see the script for why that one is not recoverable).
# - `image` builds the deliverable. Nothing built it before, which is how the image came
#   to point `PDFIUM_DYNAMIC_LIB_PATH` at a directory it does not create — every PDF in
#   that image would have failed at the first page. On merges and on request only: it
#   compiles the workspace in release and there is no reason to pay that per push.
# - `compose` runs the system *inside* that image: the API over HTTP, behind a real
#   Keycloak realm, with the stack of deploy/compose. Everything above either runs the
#   pipeline in process (`integration`) or builds the image without running the system in
#   it (`image`), so until this job nothing had ever exercised the image, the HTTP
#   surface and a verified token together. It runs the `fake` model tier, so it proves
#   the suite is **wired** and says nothing about extraction quality — see
#   deploy/compose/README.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` so tests and examples are linted too; the three defects found by
      # execution were in test-adjacent code as often as not.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  newest:
    name: newest toolchain and newest dependencies
    runs-on: ubuntu-latest
    # The policy is to track the newest stable Rust and the newest dependency versions,
    # so the job that used to check an older toolchain (`msrv`) would now be checking
    # something nothing supports. This checks the other direction instead: it updates the
    # lockfile and reports what the newest versions break, before a routine
    # `cargo update` does it to someone locally.
    #
    # Informational on purpose. What it catches is upstream's change rather than this
    # pull request's, so it must not be the thing that blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    name: tests that need Postgres, Qdrant, S3 and Keycloak
    runs-on: ubuntu-latest
    services:
      # The one service with a health check and nothing to provision beyond a role.
      # Qdrant, Garage and Keycloak are started by the script below, which can run the
      # arguments and run the setup commands a `services:` block cannot.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ds
          POSTGRES_PASSWORD: ds
          POSTGRES_DB: document_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # `sqlx::test` creates a database per test, so this role needs CREATEDB — the
      # Postgres superuser has it.
      DATABASE_URL: postgres://ds:ds@127.0.0.1:5432/document_suite
      DS__POSTGRES__PASSWORD: ds_app
      DS__QDRANT__URL: http://127.0.0.1:6334 # gRPC, not the 6333 REST port
      AWS_ENDPOINT: http://127.0.0.1:3900
      AWS_REGION: garage
      AWS_ALLOW_HTTP: "true"
      # The fixed dev credentials from crates/ds-infra/devenv.nix, so a local `devenv up`
      # and this job read the same values. Not secrets: this Garage lasts one job.
      AWS_ACCESS_KEY_ID: GK0123456789abcdef01234567
      AWS_SECRET_ACCESS_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # The realm `deploy/keycloak/realm-dev.json` describes, imported by the script
      # below. `ds-api` cannot start without one, and the auth test asks it for a token.
      DS_KEYCLOAK_ISSUER: http://127.0.0.1:8081/realms/koki
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Qdrant, Garage and Keycloak
        run: .github/scripts/services.sh
      - name: Create the runtime role
        # Migration 0003 refuses to run without it, by design: the grants it makes are
        # the difference between the worker being able to write and being able to delete.
        run: |
          PGPASSWORD=ds psql -h 127.0.0.1 -U ds -d document_suite \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'ds_app')
                THEN CREATE ROLE ds_app LOGIN PASSWORD 'ds_app'; END IF; END \$\$;"
      - run: cargo test --workspace -- --include-ignored
      - name: Service logs
        if: failure()
        run: for c in ds-ci-qdrant ds-ci-garage ds-ci-keycloak; do echo "== $c"; docker logs "$c" 2>&1 | tail -40; done

  lint:
    name: shell, dependencies and migrations
    runs-on: ubuntu-latest
    steps:
      # Full history: the migration check compares this branch against where it left the
      # base, and a shallow clone has no base to compare with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Preinstalled on the runner. `init.sh` is POSIX sh for busybox and declares so in
      # its shebang, which is what shellcheck reads to pick a dialect.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      # An unused dependency is not only noise: `ds-api` declared the model registry and
      # the step registry it does not use, and linked the Qdrant gRPC client, the PDF
      # renderer and the image codecs into the HTTP API through them.
      - name: unused dependencies
        run: cargo machete
      - name: migrations are append-only
        run: |
          base=${{ github.event_name == 'pull_request'
                   && format('origin/{0}', github.base_ref)
                   || 'HEAD~1' }}
          .github/scripts/migrations-are-append-only.sh "$base"

  image:
    name: the service image builds and can load pdfium
    runs-on: ubuntu-latest
    # On pull requests too, now that `compose` runs the system inside this image and
    # reuses the layer cache this job populates. The release build is paid once.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: document-suite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The check the image needed and did not have. pdfium is loaded by `dlopen` at the
      # first page rather than at startup, so a wrong path is a runtime failure in the
      # ingest stage and nothing earlier notices — `PDFIUM_DYNAMIC_LIB_PATH` is read as a
      # directory (see crates/ds-ingest/src/pdf.rs).
      - name: pdfium is where the service will look for it
        run: |
          docker run --rm --entrypoint sh document-suite:ci -c '
            set -e
            test -f "$PDFIUM_DYNAMIC_LIB_PATH/libpdfium.so"
            test -f "$DS_CONFIG"
            echo "pdfium: $PDFIUM_DYNAMIC_LIB_PATH/libpdfium.so, config: $DS_CONFIG"'
      - name: The binary runs
        run: docker run --rm --entrypoint /usr/local/bin/ds-suite document-suite:ci --help

  compose:
    name: compose smoke (fake models — functionality, not fidelity)
    runs-on: ubuntu-latest
    # Reuses the layer cache the image job populates, so the release build is compiled
    # once per commit rather than once per job.
    needs: image
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built here rather than by `stack.sh --build`, so both images come from the shared
      # cache. `stack.sh --no-build` then only starts them.
      - name: The service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: document-suite:itest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The fake model tier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.fakemodels
          load: true
          tags: document-suite-fakemodels:itest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Up
        run: deploy/compose/stack.sh up --tier fake --no-build

      # The suite itself. This replaced a page of hand-written curl assertions: the Rust
      # harness checks everything they did and a great deal they could not — that the
      # issuer the realm stamps is the one the service accepts, that a DAG list uploaded
      # through the API is accepted by the production registry, that every block is
      # traceable to the step and model that made it, that both routing paths are taken,
      # that another organization is refused, and that the scored artifacts are the ones
      # `ds-adapt select` and `report::render` consume unchanged.
      #
      # `--ignored` because a test needing a service carries `#[ignore]` here, and
      # `stack_or_skip` on top of it means these skip rather than fail without a stack —
      # so the `--include-ignored` set stays runnable on a machine with no Docker.
      #
      # The latency test reports and skips its assertions until this runner shape has a
      # baseline in deploy/compose/baselines/. Recording one is a deliberate act
      # (DS_ITEST_WRITE_BASELINE=1), not something a CI run should do for itself.
      - name: The integration suite
        run: |
          eval "$(deploy/compose/stack.sh env)"
          cargo test -p ds-itest --test smoke --test fidelity -- --ignored --nocapture

      # Separately, and after the others, because the service is configured for one
      # document at a time: an upload from another test queues behind this one and the
      # queue time lands in the measurement. Contention has to be outside a latency
      # number or it is a measurement of the test runner.
      - name: Latency
        run: |
          eval "$(deploy/compose/stack.sh env)"
          cargo test -p ds-itest --test latency -- --ignored --nocapture

      - name: Logs
        if: failure()
        run: deploy/compose/stack.sh logs
      - name: Down
        if: always()
        run: deploy/compose/stack.sh down
