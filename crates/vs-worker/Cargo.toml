[package]
name = "vs-worker"
description = "Worker roles ingest | page | doc, run by vs-suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vs-core.workspace = true
vs-infra.workspace = true
vs-ingest.workspace = true
vs-classify.workspace = true
vs-dag.workspace = true
vs-router.workspace = true
vs-models.workspace = true
vs-steps.workspace = true
vs-stitch.workspace = true
vs-extract.workspace = true
vs-graph.workspace = true
vs-vault.workspace = true
vs-vectors.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
image.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The unit tests in `src/`: a fixed timestamp, and an in-memory blob store. The
# end-to-end pipeline test moved to `vs-suite`, which is where the binary it
# re-executes for rendering now lives.
chrono.workspace = true
object_store.workspace = true
# `test-util` for paused time: the retry tests assert the number of attempts, and would
# otherwise sit through the real backoff.
tokio = { workspace = true, features = ["test-util"] }
