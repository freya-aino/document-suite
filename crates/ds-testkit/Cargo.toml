[package]
name = "ds-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Test doubles shared by the suite's tests and by the integration stack."

# No `ds-*` dependency, deliberately. `ds-models`, `ds-api`, `ds-suite` and `ds-adapt`
# all dev-depend on this crate, so a dependency in the other direction would be a cycle.
# The fake speaks the wire format — OpenAI-compatible JSON — and never the suite's types.
[dependencies]
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# One test asks the fake over HTTP rather than calling it, because the thing it checks —
# that a page-sized body is accepted — lives in the transport and nowhere else.
reqwest.workspace = true

[[bin]]
name = "ds-fake-models"
path = "src/bin/ds-fake-models.rs"
